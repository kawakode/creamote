name: Release

# Une étiquette vX.Y.Z construit tous les paquets et crée une release en
# brouillon. Lancé à la main (workflow_dispatch), il construit les paquets
# sans rien publier (artefacts du workflow) : pratique pour tester.
#
# Les signatures sont facultatives : chaque étape de signature est sautée
# tant que ses secrets ne sont pas configurés. Voir docs/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Clé publique de mise à jour (variable du dépôt UPDATE_PUBKEY, format
  # Tauri) : intégrée au host et au client. Vide = pas de mise à jour auto.
  CREAMOTE_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
  # Clé privée correspondante : signe les paquets du client pour le greffon
  # updater de Tauri, et les manifestes.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PRIVATE_KEY_PASSWORD }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tauri-config: ${{ steps.tauri.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: version du workspace (et de l'étiquette)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          client=$(sed -n 's/^  "version": "\(.*\)",/\1/p' client/src-tauri/tauri.conf.json)
          test "$version" = "$client" || { echo "client $client ≠ workspace $version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo "étiquette $GITHUB_REF_NAME ≠ v$version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: tauri
        name: configuration de mise à jour du client
        run: |
          if [ -n "$CREAMOTE_UPDATE_PUBKEY" ]; then
            jq -cn --arg key "$CREAMOTE_UPDATE_PUBKEY" --arg repo "$GITHUB_REPOSITORY" '{
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: {
                pubkey: $key,
                endpoints: ["https://github.com/\($repo)/releases/latest/download/client-latest.json"]
              } }
            }' > tauri-update.json
          else
            echo '{}' > tauri-update.json
          fi
          echo "config=$(cat tauri-update.json)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            client/src-tauri
      - name: dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: serveur et host
        run: cargo build --release --locked -p creamote-server -p creamote-host -p creamote-cli
      - name: paquets du host (deb, rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          mkdir -p dist
          for fmt in deb rpm; do
            ARCH=amd64 "$(go env GOPATH)/bin/nfpm" package -f packaging/linux/nfpm-host.yaml -p "$fmt" -t dist/
          done
      - name: archives du serveur et de la CLI
        run: |
          tar -C target/release -czf "dist/creamote-server-$VERSION-linux-x86_64.tar.gz" creamote-server
          tar -C target/release -czf "dist/creamote-cli-$VERSION-linux-x86_64.tar.gz" creamote-cli
      - name: client (deb, rpm, AppImage)
        working-directory: client/src-tauri
        env:
          TAURI_CONFIG: ${{ needs.version.outputs.tauri-config }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --config "$TAURI_CONFIG"
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage* ../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signature Azure Trusted Signing, si configurée.
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            client/src-tauri
      - name: host
        run: cargo build --release --locked -p creamote-host -p creamote-cli
      - name: client (sans paquet)
        working-directory: client/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --no-bundle
      - name: signature des exécutables
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\creamote-host.exe
            ${{ github.workspace }}\target\release\creamote-cli.exe
            ${{ github.workspace }}\client\src-tauri\target\release\creamote-client.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: MSI du host
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build packaging/windows/host.wxs -arch x64 `
            -d Version=$env:VERSION -d HostExe=target/release/creamote-host.exe `
            -o "dist/creamote-host-$env:VERSION-x64.msi"
          Compress-Archive target/release/creamote-cli.exe "dist/creamote-cli-$env:VERSION-windows-x64.zip"
      - name: paquets du client (MSI, NSIS)
        working-directory: client/src-tauri
        shell: pwsh
        env:
          TAURI_CONFIG: ${{ needs.version.outputs.tauri-config }}
        run: |
          cargo tauri bundle --config "$env:TAURI_CONFIG"
          Copy-Item target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe ../../dist/
      - name: signature des installeurs
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            client/src-tauri
      - name: certificats dans un trousseau temporaire
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/creamote.keychain-db"
          pw=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: host universel (Apple Silicon + Intel)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p creamote-host -p creamote-cli --target "$t"
          done
          mkdir -p dist universal
          for b in creamote-host creamote-cli; do
            lipo -create -output "universal/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
      - name: paquet du host
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          packaging/macos/build-pkg.sh universal/creamote-host "$VERSION" \
            "dist/creamote-host-$VERSION-macos.pkg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --options runtime --identifier org.creamote.cli \
              --sign "$APPLE_SIGNING_IDENTITY" universal/creamote-cli
          fi
          ditto -c -k universal/creamote-cli "dist/creamote-cli-$VERSION-macos.zip"
      - name: notarisation du host
        if: env.SIGN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pkg="dist/creamote-host-$VERSION-macos.pkg"
          xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$pkg"
      - name: client universel (dmg), signé et notarisé par Tauri si configuré
        working-directory: client/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_CONFIG: ${{ needs.version.outputs.tauri-config }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --target universal-apple-darwin --config "$TAURI_CONFIG"
          bundle=target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/*.dmg ../../dist/
          if [ -f "$bundle/macos/Creamote.app.tar.gz" ]; then
            cp "$bundle/macos/Creamote.app.tar.gz" "../../dist/Creamote_${VERSION}_universal.app.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  docker:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image du serveur
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/creamote-server"
          docker build -f deploy/Dockerfile -t "$image:$VERSION" -t "$image:latest" .
          docker push "$image:$VERSION"
          docker push "$image:latest"

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: dtolnay/rust-toolchain@stable
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
      - name: manifestes de mise à jour signés
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          rm -f dist/*.sig
          # Signatures refaites sur les fichiers finaux (les installeurs
          # Windows sont signés Authenticode après la construction).
          for f in "dist/Creamote_${VERSION}_x64-setup.exe" \
                   "dist/Creamote_${VERSION}_universal.app.tar.gz" \
                   "dist/Creamote_${VERSION}_amd64.AppImage"; do
            cargo tauri signer sign "$f"
          done
          python3 -I src/tools/release-manifest.py dist "$GITHUB_REPOSITORY" "$TAG" "$VERSION"
          cargo tauri signer sign dist/host-latest.json
      - name: empreintes SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
      - name: release en brouillon
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "Creamote $VERSION" --generate-notes
