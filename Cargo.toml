[workspace]
resolver = "3"
members = [
    "crates/creamote-proto",
    "crates/creamote-crypto",
    "server",
    "host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/kawakode/creamote"
# Licence à confirmer (voir docs/adr/0001-stack.md)
publish = false

[workspace.dependencies]
creamote-proto = { path = "crates/creamote-proto" }
creamote-crypto = { path = "crates/creamote-crypto" }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
bytes = "1"
thiserror = "2"
snow = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
