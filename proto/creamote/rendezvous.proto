syntax = "proto3";

package creamote.rendezvous.v1;

import "creamote/common.proto";

// Messages échangés entre un pair (client/host) et le serveur de rendezvous.
// Le serveur ne voit jamais le contenu des sessions : uniquement ces messages
// de mise en relation.

message RegisterPeer {
  creamote.common.v1.DeviceIdentity identity = 1;
  creamote.common.v1.Platform platform = 2;
  creamote.common.v1.Version version = 3;
  // Adresses locales (LAN) annoncées pour la tentative de connexion directe.
  repeated string local_addrs = 4;
  // Preuve de possession de la clé d'identité : signature Ed25519 de
  // "creamote/register/v1" || exporteur TLS de la connexion QUIC (RFC 5705,
  // label "EXPORTER-creamote-register", 32 octets). Liée à la connexion, elle
  // ne peut pas être rejouée sur une autre.
  bytes proof = 5;
  // Le pair refuse la connexion directe : le serveur ne communique jamais
  // ses adresses à l'autre pair et la session passe par le relay.
  bool relay_only = 6;
}

message RegisterPeerResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_ID_CONFLICT = 2;
    STATUS_RATE_LIMITED = 3;
    STATUS_VERSION_UNSUPPORTED = 4;
    STATUS_INVALID_PROOF = 5;
  }
  Status status = 1;
  // ID affiché à l'utilisateur, dérivé de la clé publique.
  string device_id = 2;
  // Adresse publique observée par le serveur (réflexion type STUN).
  string observed_addr = 3;
  ServerPolicy policy = 4;
}

// Limites appliquées par le serveur (renseignées en mode public).
message ServerPolicy {
  bool public_mode = 1;
  uint32 max_concurrent_relay_sessions = 2;
  // 0 = illimité.
  uint32 max_relay_session_seconds = 3;
  // 0 = illimité.
  uint64 max_relay_bitrate_bps = 4;
  // Sessions relay simultanées par adresse IP du demandeur, 0 = illimité.
  uint32 max_relay_sessions_per_ip = 5;
}

// Le client demande à joindre un appareil.
message ConnectRequest {
  string target_device_id = 1;
  creamote.common.v1.DeviceIdentity requester = 2;
  // Ticket signé par le serveur de gestion (mode géré), vide sinon.
  bytes session_ticket = 3;
  // Choisi par le demandeur pour corréler la réponse (RelayGrant ou
  // ConnectRejected).
  uint64 request_id = 4;
}

// Le serveur relaie l'offre au host, avec les adresses du demandeur.
message ConnectOffer {
  bytes session_id = 1;
  creamote.common.v1.DeviceIdentity requester = 2;
  string requester_observed_addr = 3;
  repeated string requester_local_addrs = 4;
  bytes session_ticket = 5;
}

message ConnectAnswer {
  bytes session_id = 1;
  bool accepted = 2;
  string host_observed_addr = 3;
  repeated string host_local_addrs = 4;
}

// Session acceptée : adresses de l'autre pair pour la connexion directe
// (hole punching) et jeton du relay, utilisé si le direct échoue.
message RelayGrant {
  bytes session_id = 1;
  // Adresse du relay ; vide = même adresse que le serveur de rendezvous.
  string relay_addr = 2;
  bytes relay_token = 3;
  // Délai pour rejoindre le relay.
  uint32 expires_in_seconds = 4;
  // request_id du ConnectRequest d'origine (côté demandeur), 0 côté host.
  uint64 request_id = 5;
  // Durée maximale de la session relay, 0 = illimitée.
  uint32 max_session_seconds = 6;
  // Adresses candidates de l'autre pair (observée par le serveur puis LAN),
  // `ip:port`. Vide si l'un des pairs est `relay_only`.
  repeated string peer_addrs = 7;
  // Relay indisponible (quota, relay plein) : `relay_token` est vide et seule
  // la connexion directe est tentée. Raison à présenter si elle échoue.
  ConnectRejected.Reason relay_unavailable = 8;
}

message ConnectRejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_TARGET_OFFLINE = 1;
    REASON_DECLINED = 2;
    REASON_RELAY_FULL = 3;
    REASON_NOT_REGISTERED = 4;
    REASON_INVALID_REQUEST = 5;
    // Quota du serveur atteint pour cette adresse IP (serveur public).
    REASON_QUOTA_EXCEEDED = 6;
  }
  uint64 request_id = 1;
  Reason reason = 2;
}

// Premier message d'un flux relay : le pair présente son jeton. Une fois les
// deux côtés présents, le relay recopie les octets d'un flux à l'autre sans
// les interpréter (ils sont chiffrés par Noise de bout en bout).
message RelayJoin {
  bytes session_id = 1;
  bytes relay_token = 2;
}

// Premier message d'une connexion directe entre pairs (QUIC, ALPN
// `creamote-p2p/1`) : le viewer désigne la session. Il ne l'envoie qu'une fois
// ce chemin choisi ; le host abandonne alors le relay. Noise authentifie
// ensuite les deux pairs comme sur le relay.
message DirectJoin {
  bytes session_id = 1;
}

// Un host enregistré rejoint un parc avec un jeton d'enrôlement créé par un
// administrateur. Son identité est déjà prouvée par l'enregistrement.
message EnrollRequest {
  string token = 1;
  // Nom affiché de la machine.
  string name = 2;
}

message EnrollResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_INVALID_TOKEN = 2;
    STATUS_ALREADY_ENROLLED = 3;
    // Serveur sans gestion de parc (ex. serveur officiel).
    STATUS_UNAVAILABLE = 4;
  }
  Status status = 1;
  string entity_name = 2;
  string fleet_name = 3;
  // Clé publique Ed25519 avec laquelle le serveur signe les tickets de
  // session. Le host l'épingle.
  bytes ticket_public_key = 4;
}

message RendezvousMessage {
  oneof kind {
    RegisterPeer register_peer = 1;
    RegisterPeerResponse register_peer_response = 2;
    ConnectRequest connect_request = 3;
    ConnectOffer connect_offer = 4;
    ConnectAnswer connect_answer = 5;
    RelayGrant relay_grant = 6;
    ConnectRejected connect_rejected = 7;
    RelayJoin relay_join = 8;
    EnrollRequest enroll_request = 9;
    EnrollResponse enroll_response = 10;
    DirectJoin direct_join = 11;
  }
}
