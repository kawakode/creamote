[workspace]
resolver = "3"
members = [
    "crates/creamote-proto",
    "crates/creamote-crypto",
    "crates/creamote-net",
    "crates/creamote-capture",
    "crates/creamote-codec",
    "crates/creamote-input",
    "crates/creamote-session",
    "server",
    "host",
    "cli",
]
# Le client Tauri a son propre workspace (dépendances système WebView).
exclude = ["client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/kawakode/creamote"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
creamote-proto = { path = "crates/creamote-proto" }
creamote-crypto = { path = "crates/creamote-crypto" }
creamote-net = { path = "crates/creamote-net" }
creamote-server = { path = "server" }
creamote-capture = { path = "crates/creamote-capture" }
creamote-codec = { path = "crates/creamote-codec" }
creamote-input = { path = "crates/creamote-input" }
creamote-session = { path = "crates/creamote-session" }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
bytes = "1"
thiserror = "2"
snow = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite", "postgres", "migrate", "macros"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Médias (M2) : API natives des OS, openh264 en repli logiciel.
x11rb = { version = "0.14", features = ["randr", "shm", "xfixes", "xtest"] }
openh264 = "0.9"
windows = "0.62"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
