# Configuration du host Creamote (lue au démarrage de chaque session).
# Une option par ligne : clé = valeur. Voir deploy/README.md.
#
# Fichier lisible par tous les utilisateurs (le host tourne dans leur
# session) : préférez un jeton d'enrôlement à usages et durée limités.
#
# server = relay.example.org:21400
# server_pin = <empreinte du serveur>
# enroll_token = <jeton créé dans la console>
# name = <nom affiché, par défaut le nom de la machine>
# relay_only = false
# clipboard = true
# file_transfer = true
