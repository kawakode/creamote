[package]
name = "creamote-mobile"
description = "Cœur Rust de l'app Android Creamote, exposé à Kotlin par uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# cdylib : libcreamote_mobile.so chargée par l'app (JNA) ; lib : tests.
crate-type = ["cdylib", "lib"]

[[bin]]
# Génère les liaisons Kotlin depuis la bibliothèque compilée :
# cargo run -p creamote-mobile --features bindgen --bin uniffi-bindgen -- \
#   generate --library <libcreamote_mobile.so> --language kotlin --out-dir <dossier>
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
creamote-crypto.workspace = true
creamote-net.workspace = true
creamote-proto.workspace = true
creamote-capture.workspace = true
creamote-codec.workspace = true
creamote-input.workspace = true
creamote-session.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
reqwest.workspace = true
serde_json.workspace = true
uniffi = "0.32"

[dev-dependencies]
creamote-server.workspace = true

[lints]
workspace = true
