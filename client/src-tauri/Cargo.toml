[package]
name = "creamote-client"
description = "Client desktop Creamote (Tauri 2)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

# Workspace distinct du dépôt : le client dépend de la WebView du système
# (WebKitGTK sous Linux), inutile pour construire le serveur ou le host.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
creamote-crypto = { path = "../../crates/creamote-crypto" }
creamote-net = { path = "../../crates/creamote-net" }
creamote-proto = { path = "../../crates/creamote-proto" }
creamote-codec = { path = "../../crates/creamote-codec" }
creamote-session = { path = "../../crates/creamote-session" }
tauri = { version = "2", features = [] }
# Choix des fichiers à envoyer (boîte de dialogue native, côté Rust : les
# chemins ne viennent jamais de la WebView) et ouverture du dossier de réception.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
