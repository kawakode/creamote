# Serveur Creamote auto-hébergé.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs creamote-server   # affiche l'empreinte
services:
  creamote-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "21400:21400/udp"
    volumes:
      - creamote-data:/data
    # Pour un serveur public (limites de sessions relay) :
    # command: ["--public", "--max-relay-sessions-per-ip", "1", "--max-relay-seconds", "600"]

volumes:
  creamote-data:
