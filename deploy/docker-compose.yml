# Serveur Creamote auto-hébergé.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs creamote-server   # affiche l'empreinte
services:
  creamote-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "21400:21400/udp"
      # API de gestion en HTTP clair : publiée sur la machine hôte uniquement,
      # à exposer via un reverse proxy TLS.
      - "127.0.0.1:21401:21401"
    volumes:
      - creamote-data:/data
    # Base PostgreSQL au lieu de SQLite :
    # environment:
    #   CREAMOTE_DATABASE_URL: postgres://creamote:motdepasse@postgres/creamote
    # Pour un serveur public (limites de sessions relay, sans gestion de parc) :
    # command: ["--public", "--max-relay-sessions-per-ip", "1", "--max-relay-seconds", "600"]

volumes:
  creamote-data:
