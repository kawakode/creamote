org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ABI compilées par cargo-ndk (séparées par des virgules). Pour un essai sur
# émulateur : -Pcreamote.abis=x86_64
creamote.abis=arm64-v8a,armeabi-v7a,x86_64
# Profil Cargo : release (défaut) ou debug.
creamote.cargoProfile=release
