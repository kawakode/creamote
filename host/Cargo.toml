[package]
name = "creamote-host"
description = "Host Creamote : service qui rend une machine contrôlable à distance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
creamote-crypto.workspace = true
creamote-net.workspace = true
creamote-proto.workspace = true
creamote-capture.workspace = true
creamote-input.workspace = true
creamote-codec.workspace = true
creamote-session.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"

[features]
default = ["wayland"]
# Wayland (portail + PipeWire) ; nécessite libpipewire-0.3 à la compilation
# et à l'exécution.
wayland = ["creamote-capture/wayland", "creamote-input/wayland"]

[lints]
workspace = true
