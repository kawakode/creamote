name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: dépendances PipeWire (Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  nat-lab:
    name: hole punching derrière NAT simulés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: dépendances PipeWire (Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev
      - run: cargo build --locked -p creamote-server -p creamote-host -p creamote-cli
      - run: |
          for mode in same-lan cone symmetric; do
            sudo tools/nat-lab.sh "$mode"
          done

  wayland-lab:
    name: capture et entrées Wayland (portail simulé + PipeWire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev dbus-daemon pipewire \
            wireplumber gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-plugins-base
      - run: tools/wayland-lab.sh

  client:
    name: client Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: dépendances WebKitGTK
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  android:
    name: cœur Android (cargo-ndk, uniffi, Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo install cargo-ndk --locked --version ^4
      - name: liaisons Kotlin sur la JVM (cœur compilé pour l'hôte, vrai serveur)
        working-directory: android
        run: ./gradlew -p jvm-tests test
      # cargo-ndk trouve le NDK du runner par ANDROID_NDK_ROOT.
      - name: AAR du cœur (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: android
        run: ./gradlew :core:assembleRelease
      - name: app Android (tests unitaires, APK de débogage, lint)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -Pcreamote.abis=arm64-v8a,x86_64

  postgres:
    name: tests PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: creamote
          POSTGRES_DB: creamote_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CREAMOTE_TEST_DATABASE_URL: postgres://postgres:creamote@localhost:5432/creamote_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p creamote-server --locked --test fleet_api --test webauthn_e2e

  docker:
    name: image du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t creamote-server:ci .
      - name: démarrage de l'image
        run: |
          docker run -d --name crs creamote-server:ci
          sleep 3
          docker logs crs
          docker logs crs | grep -q "Empreinte"

  packaging:
    name: paquets du host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: dépendances PipeWire (Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev
      - run: cargo build --release --locked -p creamote-host
      - name: deb et rpm
        if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          mkdir -p dist
          for fmt in deb rpm; do
            VERSION=0.0.0 ARCH=amd64 "$(go env GOPATH)/bin/nfpm" package -f packaging/linux/nfpm-host.yaml -p "$fmt" -t dist/
          done
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -q usr/lib/systemd/user/creamote-host.service
      - name: MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/host.wxs -arch x64 -d Version=0.0.0 `
            -d HostExe=target/release/creamote-host.exe -o creamote-host.msi
          Get-Item creamote-host.msi
      - name: pkg (non signé)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build-pkg.sh target/release/creamote-host 0.0.0 creamote-host.pkg
          pkgutil --expand creamote-host.pkg expanded
          ls -R expanded | grep -q Payload
