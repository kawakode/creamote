[package]
name = "creamote-input"
description = "Injection clavier/souris Creamote par les API natives (SendInput, CGEvent, XTest, portail Wayland)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
creamote-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus.workspace = true

[features]
default = []
# Wayland : injection par le portail RemoteDesktop.
wayland = ["creamote-capture/wayland"]

[lints]
workspace = true
